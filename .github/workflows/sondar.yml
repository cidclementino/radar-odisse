name: Sondar fontes candidatas

# Só manual. Verifica sites candidatos a fonte (feed, API do WordPress, publicações sobre concurso)
# ou roda um parser sem enviar nada ao Radar, e imprime o resultado no log. Não grava nada.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Domínios separados por espaço (vazio = lista padrão do script)'
        required: false
        default: ''
      parser:
        description: 'Em vez de sondar, testar um parser (ex.: iab, bustler)'
        required: false
        default: ''

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Sondar ou testar parser
        env:
          SITES: ${{ inputs.sites }}
          PARSER: ${{ inputs.parser }}
        run: |
          if [ -n "$PARSER" ]; then
            [[ "$PARSER" =~ ^[a-z0-9-]+$ ]] || { echo "::error::nome de parser inválido"; exit 1; }
            node "parsers/$PARSER.js"
          else
            node scripts/sondar-fontes.js
          fi
