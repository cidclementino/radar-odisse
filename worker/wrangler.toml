name = "radar-odisse" # mesmo nome do Worker publicado (radar-odisse.reservaprojectbasework.workers.dev)
main = "index.js"
compatibility_date = "2026-07-01"

# Depois de criar os namespaces (wrangler kv namespace create CONCURSOS / REVISAO),
# troque os ids abaixo pelos reais.
kv_namespaces = [
  { binding = "CONCURSOS", id = "c3832f3f687c4976bad2240e328a736f" },
  { binding = "REVISAO", id = "34ddf653fcf044ea9871dc072844493d" },
  { binding = "OPORTUNIDADES", id = "6f2980b7894b4b7eb1582795b996b0f4" },
  { binding = "CORRETORES", id = "d2e2967d78be465c81937cb130bd20c0" },
  # Licitações (PNCP): o id é posto pelo workflow de publicação (.github/workflows/worker.yml), que
  # acha ou cria o namespace "radar-odisse-LICITACOES". Para publicar à mão, troque pelo id real.
  { binding = "LICITACOES", id = "__LICITACOES_ID__" },
]

# Defina com: wrangler secret put COLLECT_SECRET
# (não coloque o valor real aqui — isso fica no dashboard/CLI da Cloudflare)

# Senha do painel (RADAR_SENHA): secret do Worker, enviado pelo workflow a partir do secret do
# repositório com o mesmo nome. Nunca aqui.

# Universo: banco comum (D1) pelo Worker do hub, ponto de entrada "Projetos" — usado para enviar um
# concurso em acompanhamento ao projetos.odisse (worker/projetos.js). Só outro Worker da mesma conta
# alcança esse ponto de entrada; não passa pela internet.
[[services]]
binding = "PROJETOS"
service = "universo-hub"
entrypoint = "Projetos"
