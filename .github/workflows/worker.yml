name: Publicar Worker do Radar (Cloudflare)

# Publica worker/ no Worker "radar-odisse" (radar-odisse.reservaprojectbasework.workers.dev) a cada
# mudança em worker/ no main. Usa os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID deste
# repositório (o token precisa de Account → Workers Scripts → Edit e Workers KV Storage → Edit).
# Regrava COLLECT_SECRET a partir de RADAR_COLLECT_SECRET, o mesmo valor que a coleta usa,
# e RADAR_SENHA (senha do painel) a partir do secret do repositório com o mesmo nome.

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch: {}

concurrency:
  group: radar-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RADAR_COLLECT_SECRET: ${{ secrets.RADAR_COLLECT_SECRET }}
      RADAR_SENHA: ${{ secrets.RADAR_SENHA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar secrets
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RADAR_SENHA RADAR_COLLECT_SECRET; do
            if [ -z "${!s}" ]; then echo "::error::Falta o secret $s neste repositório (Settings → Secrets and variables → Actions)."; exit 1; fi
          done

      - name: Publicar
        working-directory: worker
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/wr" wrangler@4
          W="$RUNNER_TEMP/wr/node_modules/.bin/wrangler"
          # Namespace de Licitações: acha pelo nome ou cria (API da Cloudflare, mesmo token), e põe o id
          # no wrangler.toml desta publicação. Idempotente: nas próximas publicações só acha.
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          NOME="radar-odisse-LICITACOES"
          acha_kv() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=(JSON.parse(s).result||[]).find(x=>x.title===process.argv[1]);if(n)console.log(n.id)})' "$NOME"; }
          KV_LICITACOES=$(acha_kv)
          if [ -z "$KV_LICITACOES" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"title\":\"$NOME\"}" "$API" >/dev/null
            KV_LICITACOES=$(acha_kv)
          fi
          [ -n "$KV_LICITACOES" ] || { echo "::error::Não achei nem criei o namespace $NOME."; exit 1; }
          echo "Namespace de Licitações: $KV_LICITACOES"
          sed -i "s/__LICITACOES_ID__/$KV_LICITACOES/" wrangler.toml
          "$W" deploy
          printf '%s' "$RADAR_COLLECT_SECRET" | "$W" secret put COLLECT_SECRET
          printf '%s' "$RADAR_SENHA" | "$W" secret put RADAR_SENHA

      - name: Conferir
        run: |
          URL="https://radar-odisse.reservaprojectbasework.workers.dev"
          for i in 1 2 3 4 5 6 7 8; do
            r=$(curl -s -o /dev/null -w '%{http_code}' "$URL/estado")
            ok=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RADAR_COLLECT_SECRET" "$URL/estado")
            [ "$r" = "401" ] && [ "$ok" = "200" ] && break
            sleep 5
          done
          echo "GET /estado sem senha: $r (esperado 401) · com o segredo da coleta: $ok (esperado 200)"
          [ "$r" = "401" ] && [ "$ok" = "200" ] || { echo "::error::A senha não está valendo. O Worker pode não ter sido publicado."; exit 1; }
          n=$(curl -s -H "Authorization: Bearer $RADAR_COLLECT_SECRET" "$URL/api/concursos" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
          echo "Concursos no Radar: $n"
